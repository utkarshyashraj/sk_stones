<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | S K Stones India</title>
    <meta name="description" content="Thank you for contacting S K Stones India. Our team will respond to your quote request shortly.">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #c9a227; --dark: #0a0a0a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3a3a3a;
            padding: 40px 20px;
            text-align: center;
        }
        .thank-box {
            max-width: 560px;
            padding: 50px 40px;
            border: 1px solid rgba(201,162,39,0.35);
            border-radius: 20px;
            background: rgba(255,255,255,0.94);
        }
        .thank-icon {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: rgba(37,211,102,0.15);
            border: 2px solid #25d366;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 28px;
            font-size: 2rem; color: #25d366;
        }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-bottom: 16px; }
        h1 span { color: var(--gold); }
        p { opacity: 0.85; line-height: 1.8; margin-bottom: 12px; font-size: 0.95rem; }
        .actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 32px; }
        .btn {
            padding: 14px 28px; border-radius: 50px; text-decoration: none;
            font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s;
        }
        .btn-primary { background: var(--gold); color: var(--dark); }
        .btn-primary:hover { background: #e6b800; transform: translateY(-2px); }
        .btn-outline { border: 2px solid var(--gold); color: #fff; }
        .btn-outline:hover { background: rgba(201,162,39,0.15); }
        .wa-note { margin-top: 24px; font-size: 0.85rem; opacity: 0.7; }
        .wa-note a { color: #25d366; text-decoration: none; }
    </style>
    <link rel="stylesheet" href="css/marble-showroom.css?v=5">
</head>
<body class="showroom-theme">
    <div class="thank-box">
        <div class="thank-icon"><i class="fas fa-check"></i></div>
        <h1>Thank <span>You!</span></h1>
        <p>Your quote request has been received. Our team at S K Stones India will review your details and get back to you within 24 hours.</p>
        <p>For urgent enquiries, call us directly or message on WhatsApp.</p>
        <div class="actions">
            <a class='btn btn-primary' href='/'>Back to Home</a>
            <a class='btn btn-outline' href='/products'>Explore Stones</a>
            <a href="tel:+917022630994" class="btn btn-outline"><i class="fas fa-phone"></i> Call Now</a>
        </div>
        <p class="wa-note">Prefer WhatsApp? <a href="https://wa.me/917022630994" target="_blank">Chat with us →</a></p>
    </div>
</body>
</html>
