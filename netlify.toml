# Netlify deployment for the static Next.js export.
# Images/catalog data are committed (public/, content/generated/), so the build needs no access to the old staging host.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# 301 redirects and response headers are generated into out/_redirects and out/_headers by scripts/postbuild.mjs.
